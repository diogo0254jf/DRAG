[project]
name = "drag"
version = "0.1.0"
description = "Conversational RAG over PDFs with a LangGraph chat graph, hybrid search and a Hatchet ingestion pipeline"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14.0",
    "faiss-cpu>=1.13.2",
    "fastapi>=0.116.1",
    "langchain-community>=0.4.1",
    "langchain-ollama>=1.0.1",
    "langgraph>=1.0.7",
    "pydantic>=2.12.5",
    "psycopg[binary]>=3.2.10",
    "python-dotenv>=1.1.1",
    "pypdf>=6.6.2",
    "sqlalchemy>=2.0.43",
    "uvicorn>=0.35.0",
    "langgraph-checkpoint-sqlite>=3.0.3",
    "hatchet-sdk>=0.50.0",
    "langchain-postgres>=0.0.13",
    "minio>=7.2.12",
    "python-multipart>=0.0.9",
    "langchain-text-splitters>=1.1.0",
    "langgraph-checkpoint-postgres>=3.0.4",
    "pdf2image>=1.17.0",
]
