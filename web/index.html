<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RAG Chat</title>
  <style>
    :root {
      --bg: #0b1016;
      --panel: #121a24;
      --text: #e8edf3;
      --muted: #9aa7b4;
      --accent: #56d6a0;
      --border: #1e2a38;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Segoe UI", Arial, sans-serif;
      background: radial-gradient(1200px 600px at 20% 0%, #12202f 0%, #0b1016 60%);
      color: var(--text);
    }
    .wrap {
      max-width: 820px;
      margin: 32px auto;
      padding: 0 16px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    }
    h1 {
      font-size: 22px;
      margin: 0 0 12px;
      letter-spacing: 0.3px;
    }
    .row {
      display: grid;
      gap: 12px;
      grid-template-columns: 1fr auto;
      margin-bottom: 16px;
    }
    input, textarea {
      width: 100%;
      background: #0d141c;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 14px;
    }
    textarea { min-height: 90px; resize: vertical; }
    button {
      background: var(--accent);
      border: none;
      color: #0b1016;
      padding: 10px 16px;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
    }
    .log {
      margin-top: 16px;
      display: grid;
      gap: 10px;
    }
    .msg {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0d141c;
      font-size: 14px;
      white-space: pre-wrap;
    }
    .msg.user { border-left: 3px solid #f1b24b; }
    .msg.assistant { border-left: 3px solid #56d6a0; }
    .muted { color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>RAG Chat</h1>
      <div class="row">
        <input id="apiUrl" value="http://localhost:8000" placeholder="API URL" />
        <button id="newChat">Nova conversa</button>
      </div>
      <div class="muted" id="convId">Conversation ID: (ainda nao criado)</div>
      <textarea id="message" placeholder="Digite sua pergunta..."></textarea>
      <div class="row" style="grid-template-columns: 1fr auto;">
        <div></div>
        <button id="send">Enviar</button>
      </div>
      <div class="log" id="log"></div>
    </div>
  </div>

  <script>
    const apiUrlEl = document.getElementById("apiUrl");
    const msgEl = document.getElementById("message");
    const logEl = document.getElementById("log");
    const convEl = document.getElementById("convId");
    const sendBtn = document.getElementById("send");
    const newBtn = document.getElementById("newChat");

    let conversationId = null;

    function addMessage(role, text) {
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = text;
      logEl.appendChild(div);
      logEl.scrollTop = logEl.scrollHeight;
    }

    async function createConversation() {
      const res = await fetch(`${apiUrlEl.value}/conversations`, { method: "POST" });
      const data = await res.json();
      conversationId = data.conversation_id;
      convEl.textContent = `Conversation ID: ${conversationId}`;
      logEl.innerHTML = "";
    }

    async function sendMessage() {
      const message = msgEl.value.trim();
      if (!message) return;
      addMessage("user", message);
      msgEl.value = "";

      const payload = { message };
      if (conversationId) payload.conversation_id = conversationId;

      const res = await fetch(`${apiUrlEl.value}/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      conversationId = data.conversation_id;
      convEl.textContent = `Conversation ID: ${conversationId}`;
      addMessage("assistant", data.response);
    }

    newBtn.addEventListener("click", createConversation);
    sendBtn.addEventListener("click", sendMessage);
  </script>
</body>
</html>
